<!DOCTYPE html>
<html>
<head>
    <title>Moon Dodger</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
        }
        canvas {
            border: 2px solid white;
            /* ¡NUEVO!: Gradiente de atardecer crepuscular para mejor contraste */
            background: linear-gradient(to bottom, #2b193d 0%, #ab4e68 60%, #e08e36 100%);
            image-rendering: pixelated; 
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const idleImg = new Image();
        idleImg.src = "ASTRONAUTA_IDLE.png"; 

        const runImg = new Image();
        runImg.src = "RUN 8 FRAMES INCLINADA FINAL_FRONT_SHOOT.png"; 

        const meteoritoImg = new Image();
        meteoritoImg.src = "Meteorito.png";

        const player = {
            x: 380,
            speed: 5,
            estado: "idle", 
            direccion: -1,   
            frameActual: 0,
            relojAnimacion: 0,
            velocidadAnimacion: 6 
        };

        let meteoritos = []; 
        let relojMeteoritos = 0;
        let frecuenciaSpawn = 60; // Empezamos más lento (1 por segundo)

        let puntos = 0;
        let gameOver = false;

        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", function(e) {
            if(e.code === "ArrowRight") rightPressed = true;
            if(e.code === "ArrowLeft") leftPressed = true;
            
            // ¡NUEVO!: Detectar el Enter para reiniciar si estamos en Game Over
            if(e.code === "Enter" && gameOver) {
                reiniciarJuego();
            }
        });

        document.addEventListener("keyup", function(e) {
            if(e.code === "ArrowRight") rightPressed = false;
            if(e.code === "ArrowLeft") leftPressed = false;
        });

        // ¡NUEVO!: Función para devolver todo a cero
        function reiniciarJuego() {
            puntos = 0;
            meteoritos = [];
            player.x = 380;
            player.estado = "idle";
            gameOver = false;
            frecuenciaSpawn = 60;
            relojMeteoritos = 0;
            gameLoop(); // Volvemos a arrancar el motor
        }

        function gameLoop() {
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "white";
                ctx.font = "40px Courier New";
                ctx.fillText("GAME OVER", 90, canvas.height / 2 - 20);
                
                ctx.font = "20px Courier New";
                ctx.fillText("Puntuación: " + Math.floor(puntos), 100, (canvas.height / 2) + 20);
                
                // Instrucción de reinicio
                ctx.fillStyle = "#e08e36";
                ctx.font = "16px Courier New";
                ctx.fillText("Pulsa [ENTER] para reiniciar", 45, (canvas.height / 2) + 70);
                return; 
            }

            // Puntuación pasiva por sobrevivir
            puntos += 0.05;

            // ¡NUEVO!: Multiplicador de dificultad. Aumenta un 10% cada 100 puntos.
            let multiplicadorDificultad = 1 + (puntos / 1000);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- LÓGICA DEL JUGADOR ---
            if (rightPressed || leftPressed) {
                player.estado = "run";
                if (rightPressed) {
                    player.x += player.speed;
                    player.direccion = 1; 
                }
                if (leftPressed) {
                    player.x -= player.speed;
                    player.direccion = -1; 
                }
            } else {
                player.estado = "idle";
            }

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - 48) player.x = canvas.width - 48;

            let imgActual = (player.estado === "idle") ? idleImg : runImg;
            let totalFrames = (player.estado === "idle") ? 4 : 8; 

            player.relojAnimacion++;
            if (player.relojAnimacion >= player.velocidadAnimacion) {
                player.frameActual++;
                if (player.frameActual >= totalFrames) {
                    player.frameActual = 0;
                }
                player.relojAnimacion = 0;
            }

            if (player.frameActual >= totalFrames) player.frameActual = 0;

            let anchoFrame = imgActual.width / totalFrames;
            let altoFrame = imgActual.height;
            const nivelDelSuelo = 500;

            let ajusteY = 0; 
            if (player.estado === "run") {
                ajusteY = 18;
            }
            let yDinamica = (nivelDelSuelo - altoFrame) + ajusteY;

            ctx.save(); 
            if (player.direccion === 1) { 
                ctx.scale(-1, 1); 
                ctx.drawImage(
                    imgActual, 
                    player.frameActual * anchoFrame, 0, anchoFrame, altoFrame,
                    -player.x - anchoFrame, yDinamica, anchoFrame, altoFrame 
                );
            } else {
                ctx.drawImage(
                    imgActual, 
                    player.frameActual * anchoFrame, 0, anchoFrame, altoFrame,
                    player.x, yDinamica, anchoFrame, altoFrame
                );
            }
            ctx.restore(); 

            // --- LÓGICA DE METEORITOS ---
            // Los meteoritos salen más rápido a medida que ganas puntos (límite máximo de rapidez: cada 20 frames)
            frecuenciaSpawn = Math.max(20, 60 - (puntos / 10));

            relojMeteoritos++;
            if (relojMeteoritos >= frecuenciaSpawn) {
                let tamaño = 40; 
                let posXAleatoria = Math.random() * (canvas.width - tamaño);
                
                // ¡NUEVO!: Empiezan muy lentos (entre 1.5 y 3.5) y se multiplican con el tiempo
                let velocidadBase = 1.5 + Math.random() * 2;
                let velocidadAleatoria = velocidadBase * multiplicadorDificultad; 

                meteoritos.push({
                    x: posXAleatoria,
                    y: -tamaño,
                    width: tamaño,
                    height: tamaño,
                    velocidad: velocidadAleatoria
                });
                
                relojMeteoritos = 0;
            }

            let hitboxPlayer = {
                x: player.x + 10,
                y: yDinamica + 10,
                width: anchoFrame - 20,
                height: altoFrame - 10
            };

            for (let i = meteoritos.length - 1; i >= 0; i--) {
                let m = meteoritos[i];
                m.y += m.velocidad;
                
                ctx.drawImage(meteoritoImg, m.x, m.y, m.width, m.height);

                if (m.x < hitboxPlayer.x + hitboxPlayer.width &&
                    m.x + m.width > hitboxPlayer.x &&
                    m.y < hitboxPlayer.y + hitboxPlayer.height &&
                    m.y + m.height > hitboxPlayer.y) {
                    
                    gameOver = true; 
                }

                if (m.y + m.height > nivelDelSuelo) {
                    meteoritos.splice(i, 1); 
                    puntos += 5; // Un poco menos de puntos por esquivar para balancearlo
                }
            }

            // --- INTERFAZ (UI) ---
            // Suelo oscurecido para dar contraste con el atardecer
            ctx.fillStyle = "#2a2a35";
            ctx.fillRect(0, nivelDelSuelo, canvas.width, canvas.height - nivelDelSuelo);

            // Línea divisoria del suelo
            ctx.fillStyle = "#e08e36";
            ctx.fillRect(0, nivelDelSuelo, canvas.width, 2);

            ctx.fillStyle = "white";
            ctx.font = "20px Courier New";
            ctx.fillText("Puntos: " + Math.floor(puntos), 10, 30);

            requestAnimationFrame(gameLoop);
        }

        let imagenesCargadas = 0;
        function comprobarCarga() {
            imagenesCargadas++;
            if (imagenesCargadas === 3) gameLoop(); 
        }

        idleImg.onload = comprobarCarga;
        runImg.onload = comprobarCarga;
        meteoritoImg.onload = comprobarCarga;

    </script>
</body>
</html>
