<!DOCTYPE html>
<html>
<head>
    <title>Moon Dodger</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
        }
        canvas {
            border: 2px solid white;
            background-color: #0f3460; 
            image-rendering: pixelated; 
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 1. CARGAMOS LAS IMÁGENES (Añadido el meteorito)
        const idleImg = new Image();
        idleImg.src = "ASTRONAUTA_IDLE.png"; 

        const runImg = new Image();
        runImg.src = "RUN 8 FRAMES INCLINADA FINAL_FRONT_SHOOT.png"; 

        const meteoritoImg = new Image();
        meteoritoImg.src = "Meteorito.png";

        // 2. CONFIGURACIÓN DEL JUGADOR
        const player = {
            x: 180,
            speed: 5,
            estado: "idle", 
            direccion: -1,   
            frameActual: 0,
            relojAnimacion: 0,
            velocidadAnimacion: 6 
        };

        // 3. SISTEMA DE METEORITOS (¡NUEVO!)
        let meteoritos = []; // La "caja" vacía donde guardaremos los clones
        let relojMeteoritos = 0;
        const FRECUENCIA_SPAWN = 45; // Cada cuántos frames sale uno nuevo (60 = 1 seg)

        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", function(e) {
            if(e.code === "ArrowRight") rightPressed = true;
            if(e.code === "ArrowLeft") leftPressed = true;
        });

        document.addEventListener("keyup", function(e) {
            if(e.code === "ArrowRight") rightPressed = false;
            if(e.code === "ArrowLeft") leftPressed = false;
        });

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- LÓGICA DEL JUGADOR ---
            if (rightPressed || leftPressed) {
                player.estado = "run";
                if (rightPressed) {
                    player.x += player.speed;
                    player.direccion = 1; 
                }
                if (leftPressed) {
                    player.x -= player.speed;
                    player.direccion = -1; 
                }
            } else {
                player.estado = "idle";
            }

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - 48) player.x = canvas.width - 48;

            let imgActual = (player.estado === "idle") ? idleImg : runImg;
            let totalFrames = (player.estado === "idle") ? 4 : 8; 

            player.relojAnimacion++;
            if (player.relojAnimacion >= player.velocidadAnimacion) {
                player.frameActual++;
                if (player.frameActual >= totalFrames) {
                    player.frameActual = 0;
                }
                player.relojAnimacion = 0;
            }

            if (player.frameActual >= totalFrames) player.frameActual = 0;

            let anchoFrame = imgActual.width / totalFrames;
            let altoFrame = imgActual.height;
            const nivelDelSuelo = 500;

            let ajusteY = 0; 
            if (player.estado === "run") {
                ajusteY = 18; // Tu número mágico
            }
            let yDinamica = (nivelDelSuelo - altoFrame) + ajusteY;

            ctx.save(); 
            if (player.direccion === 1) { 
                ctx.scale(-1, 1); 
                ctx.drawImage(
                    imgActual, 
                    player.frameActual * anchoFrame, 0, anchoFrame, altoFrame,
                    -player.x - anchoFrame, yDinamica, anchoFrame, altoFrame 
                );
            } else {
                ctx.drawImage(
                    imgActual, 
                    player.frameActual * anchoFrame, 0, anchoFrame, altoFrame,
                    player.x, yDinamica, anchoFrame, altoFrame
                );
            }
            ctx.restore(); 

            // --- LÓGICA DE SPAWN DE METEORITOS (¡NUEVO!) ---
            relojMeteoritos++;
            if (relojMeteoritos >= FRECUENCIA_SPAWN) {
                let tamaño = 40; // Escalamos la imagen de 128x128 a 40x40
                
                // Math.random() da un número entre 0 y 1. Lo multiplicamos para dar aleatoriedad.
                let posXAleatoria = Math.random() * (canvas.width - tamaño);
                let velocidadAleatoria = 3 + Math.random() * 4; // Bajarán a una velocidad entre 3 y 7

                // Metemos un nuevo objeto meteorito en nuestra lista
                meteoritos.push({
                    x: posXAleatoria,
                    y: -tamaño, // Empieza justo arriba, fuera de la pantalla
                    width: tamaño,
                    height: tamaño,
                    velocidad: velocidadAleatoria
                });
                
                relojMeteoritos = 0; // Reseteamos el reloj
            }

            // --- MOVER Y DIBUJAR METEORITOS (¡NUEVO!) ---
            // Recorremos la lista HACIA ATRÁS. Es un truco vital de programación para que 
            // no haya bugs al borrar elementos de una lista mientras la estamos leyendo.
            for (let i = meteoritos.length - 1; i >= 0; i--) {
                let m = meteoritos[i];
                
                // Aplicamos la gravedad sumando a la Y
                m.y += m.velocidad;
                
                // Dibujamos el meteorito
                ctx.drawImage(meteoritoImg, m.x, m.y, m.width, m.height);

                // El "Destroy": Si toca la línea del suelo lunar, lo borramos de la memoria
                if (m.y + m.height > nivelDelSuelo) {
                    meteoritos.splice(i, 1); // Splice elimina 1 elemento en la posición 'i'
                }
            }

            // --- DIBUJAR EL SUELO FIJO ---
            ctx.fillStyle = "#8a8a8a";
            ctx.fillRect(0, nivelDelSuelo, canvas.width, canvas.height - nivelDelSuelo);

            requestAnimationFrame(gameLoop);
        }

        // Arrancamos el juego cuando TODO esté cargado
        let imagenesCargadas = 0;
        function comprobarCarga() {
            imagenesCargadas++;
            // Ahora esperamos a 3 imágenes en lugar de 1
            if (imagenesCargadas === 3) gameLoop(); 
        }

        idleImg.onload = comprobarCarga;
        runImg.onload = comprobarCarga;
        meteoritoImg.onload = comprobarCarga;

    </script>
</body>
</html>
